[theme]
primaryColor = "#2E63BF"
backgroundColor = "#F4F8FF"
secondaryBackgroundColor = "#EAF1FF"
textColor = "#1A2A4A"
font = "sans serif"

[server]
enableCORS = true
enableXsrfProtection = true

[client]
# Keep Streamlit's own developer/help menu out of the product experience.
toolbarMode = "minimal"
