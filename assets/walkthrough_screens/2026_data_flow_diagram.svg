<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#00A79D"/></marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0B1F3A}.label{font:700 17px Arial,sans-serif;fill:#008F88;letter-spacing:1px}.head{font:700 24px Arial,sans-serif;fill:#12233F}.copy{font:18px Arial,sans-serif;fill:#63738D}.copy2{font:16px Arial,sans-serif;fill:#63738D}.white{font:700 20px Arial,sans-serif;fill:#fff}.note{font:italic 18px Arial,sans-serif;fill:#63738D}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F6F9FE"/>
  <text x="70" y="65" class="label">DATA-FLOW ARCHITECTURE</text>
  <text x="70" y="118" class="title">How a case question becomes a grounded report and human audit event</text>
  <text x="70" y="168" class="label">CASE-REVIEW FLOW</text>
  <g stroke="#B7CBEA" stroke-width="2">
    <rect x="55" y="195" rx="18" width="275" height="150" fill="#fff"/><rect x="370" y="195" rx="18" width="275" height="150" fill="#fff"/>
    <rect x="685" y="195" rx="18" width="275" height="150" fill="#fff"/><rect x="1000" y="195" rx="18" width="275" height="150" fill="#E6F8F6"/>
    <rect x="1315" y="195" rx="18" width="230" height="150" fill="#fff"/>
  </g>
  <g fill="#2E65C5"><circle cx="85" cy="225" r="19"/><circle cx="400" cy="225" r="19"/><circle cx="715" cy="225" r="19"/><circle cx="1345" cy="225" r="19"/></g><circle cx="1030" cy="225" r="19" fill="#00A79D"/>
  <g font-family="Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><text x="85" y="230">1</text><text x="400" y="230">2</text><text x="715" y="230">3</text><text x="1030" y="230">4</text><text x="1345" y="230">5</text></g>
  <text x="82" y="280" class="head">Active case + question</text><text x="82" y="312" class="copy2">Queue selection and</text><text x="82" y="335" class="copy2">bounded question</text>
  <text x="397" y="280" class="head">SQLite case evidence</text><text x="397" y="312" class="copy2">Fictional rows, documents,</text><text x="397" y="335" class="copy2">and workflow state</text>
  <text x="712" y="280" class="head">Specialist components</text><text x="712" y="312" class="copy2">Triage · KYC · transactions</text><text x="712" y="335" class="copy2">relationships · evidence</text>
  <text x="1027" y="280" class="head">Summary + validator</text><text x="1027" y="312" class="copy2">Optional Gemini draft;</text><text x="1027" y="335" class="copy2">grounded checks</text>
  <text x="1342" y="280" class="head">Human + audit</text><text x="1342" y="312" class="copy2">Required rationale;</text><text x="1342" y="335" class="copy2">Compliance review</text>
  <g stroke="#00A79D" stroke-width="4" marker-end="url(#arrow)"><line x1="332" y1="270" x2="360" y2="270"/><line x1="647" y1="270" x2="675" y2="270"/><line x1="962" y1="270" x2="990" y2="270"/><line x1="1277" y1="270" x2="1305" y2="270"/></g>
  <text x="70" y="438" class="label">RETRIEVAL FLOW</text>
  <g stroke="#B7CBEA" stroke-width="2"><rect x="95" y="465" rx="17" width="290" height="115" fill="#fff"/><rect x="470" y="465" rx="17" width="290" height="115" fill="#fff"/><rect x="845" y="465" rx="17" width="290" height="115" fill="#E6F8F6"/><rect x="1220" y="465" rx="17" width="290" height="115" fill="#fff"/></g>
  <text x="240" y="510" class="head" text-anchor="middle">OKF knowledge source</text><text x="240" y="543" class="copy" text-anchor="middle">Stable metadata + body</text>
  <text x="615" y="510" class="head" text-anchor="middle">C0 + body chunks</text><text x="615" y="543" class="copy" text-anchor="middle">Inspectable chunk IDs</text>
  <text x="990" y="510" class="head" text-anchor="middle">FTS5 + BM25</text><text x="990" y="543" class="copy" text-anchor="middle">Lexical match + ranking</text>
  <text x="1365" y="510" class="head" text-anchor="middle">Retrieved citations</text><text x="1365" y="543" class="copy" text-anchor="middle">Exact source passages</text>
  <g stroke="#00A79D" stroke-width="4" marker-end="url(#arrow)"><line x1="388" y1="522" x2="457" y2="522"/><line x1="763" y1="522" x2="832" y2="522"/><line x1="1138" y1="522" x2="1207" y2="522"/><line x1="1365" y1="463" x2="1365" y2="360"/></g>
  <text x="1390" y="410" class="copy2">cited retrieval context</text>
  <rect x="75" y="665" rx="18" width="1450" height="82" fill="#173C78"/>
  <text x="800" y="715" class="white" text-anchor="middle">Control boundary: the model drafts only in optional AI mode; validation checks selected claims; confidence exposes limitations; no workflow action is automated.</text>
  <text x="800" y="815" class="note" text-anchor="middle">FTS5/BM25 finds supplied text—not truth. Citations, confidence, and validation guide review; a named human records the action.</text>
</svg>
