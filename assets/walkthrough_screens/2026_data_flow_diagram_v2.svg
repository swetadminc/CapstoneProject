  <rect x="80" y="700" rx="22" width="1440" height="82" fill="#173C78"/><text x="800" y="751" class="bar" text-anchor="middle">Control boundary: retrieval finds supplied text; validation checks selected claims; confidence exposes limitations; no action is automated.</text><text x="800" y="850" class="note" text-anchor="middle">A named person interprets the evidence and records the next step.</text>
