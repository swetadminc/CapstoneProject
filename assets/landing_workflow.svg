<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-labelledby="title description">
  <title id="title">InvestigateIQ: from alert to accountable action</title>
  <desc id="description">A fictional alert enters the case queue. The copilot gathers evidence and drafts findings. An investigator makes a reasoned decision. Escalated cases receive human compliance review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c31"/>
      <stop offset="1" stop-color="#1d3b70"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#213c62"/>
      <stop offset="1" stop-color="#19304f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="1196" height="274" rx="22" fill="url(#background)" stroke="#426793" stroke-width="2"/>
  <text x="34" y="44" fill="#f4f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">From alert to accountable action</text>
  <text x="1164" y="43" text-anchor="end" fill="#a9c9f5" font-family="Segoe UI,Arial,sans-serif" font-size="13">INVESTIGATEIQ · CAPSTONE GROUP 7</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(34 74)">
      <rect width="258" height="158" rx="18" fill="url(#card)" stroke="#6287b6"/>
      <circle cx="36" cy="38" r="20" fill="#3470ca"/>
      <text x="36" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="700">01</text>
      <text x="22" y="91" fill="white" font-size="21" font-weight="700">Case Queue</text>
      <text x="22" y="120" fill="#bed4ef" font-size="15">Choose a fictional alert</text>
      <text x="22" y="142" fill="#bed4ef" font-size="15">for review</text>
    </g>
    <g transform="translate(324 74)">
      <rect width="258" height="158" rx="18" fill="url(#card)" stroke="#6287b6"/>
      <circle cx="36" cy="38" r="20" fill="#3470ca"/>
      <text x="36" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="700">02</text>
      <text x="22" y="91" fill="white" font-size="21" font-weight="700">Copilot draft</text>
      <text x="22" y="120" fill="#bed4ef" font-size="15">Gather evidence and</text>
      <text x="22" y="142" fill="#bed4ef" font-size="15">synthetic guidance</text>
    </g>
    <g transform="translate(614 74)">
      <rect width="258" height="158" rx="18" fill="url(#card)" stroke="#6287b6"/>
      <circle cx="36" cy="38" r="20" fill="#3470ca"/>
      <text x="36" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="700">03</text>
      <text x="22" y="91" fill="white" font-size="21" font-weight="700">Human decision</text>
      <text x="22" y="120" fill="#bed4ef" font-size="15">Review findings and</text>
      <text x="22" y="142" fill="#bed4ef" font-size="15">record a rationale</text>
    </g>
    <g transform="translate(904 74)">
      <rect width="258" height="158" rx="18" fill="url(#card)" stroke="#6287b6"/>
      <circle cx="36" cy="38" r="20" fill="#3470ca"/>
      <text x="36" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="700">04</text>
      <text x="22" y="91" fill="white" font-size="21" font-weight="700">Compliance</text>
      <text x="22" y="120" fill="#bed4ef" font-size="15">Human follow-up on</text>
      <text x="22" y="142" fill="#bed4ef" font-size="15">escalated cases</text>
    </g>
    <g fill="#83b6ff" font-size="27" font-weight="700">
      <text x="300" y="169" text-anchor="middle">→</text>
      <text x="590" y="169" text-anchor="middle">→</text>
      <text x="880" y="169" text-anchor="middle">→</text>
    </g>
  </g>
  <text x="34" y="259" fill="#afc6e4" font-family="Segoe UI,Arial,sans-serif" font-size="13">Human-controlled workflow · fictional data · no automatic regulatory filing</text>
</svg>
